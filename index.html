<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="40X">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="40X">
<meta name="description" content="Registro de entrenamiento 40X con progresión y PRs">
<title>40X — Registro · v1.5</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10; --surface:#141822; --surface-2:#1c2030; --surface-3:#262b3a;
    --line:rgba(255,255,255,.06); --line-soft:rgba(255,255,255,.03);
    --text:#e8e6e1; --dim:#8b919e; --dim2:#5d6370;
    --torsoA:#7c9bc4; --torsoA-l:#a3bbd9; --legsA:#8bbd8f; --legsA-l:#aed3b1;
    --torsoB:#c99580; --torsoB-l:#dcb09d; --legsB:#d4b87a; --legsB-l:#e2cb9a;
    --green:#8bbd8f; --amber:#d4b87a; --red:#cf8580;
    --shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.18);
    --shadow-lg: 0 8px 32px rgba(0,0,0,.35);
    --ease: cubic-bezier(.4,0,.2,1);
    --ease-out: cubic-bezier(0,0,.2,1);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  input,select,textarea,button{font-family:inherit;}
  input:focus,select:focus,textarea:focus{
    outline:none;
    box-shadow: 0 0 0 3px rgba(124,155,196,.18);
    border-color: var(--torsoA);
  }
  .app{max-width:520px;margin:0 auto;padding-bottom:96px;min-height:100vh;}
  .head{padding:24px 20px 14px;position:sticky;top:0;background:var(--bg);z-index:20;border-bottom:1px solid transparent;}
  .head-row{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--torsoA),var(--legsA));display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .head h1{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.2px;margin:0;line-height:1;}
  .head .sub{font-size:12.5px;color:var(--dim);margin-top:2px;}
  .tabs{display:flex;gap:6px;padding:16px 20px 0;}
  .tab{flex:1;text-align:center;padding:10px 2px;border-radius:11px;font-size:11.5px;font-weight:600;color:var(--dim);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:all .18s ease;display:flex;flex-direction:column;align-items:center;gap:3px;}
  .tab svg{width:17px;height:17px;stroke:var(--dim);transition:stroke .18s ease;}
  .tab.active{color:#0b0e12;background:linear-gradient(135deg,var(--torsoA-l),var(--torsoA));border-color:transparent;}
  .tab.active svg{stroke:#0b0e12;}
  .panel{padding:18px 20px;display:none;animation:fadein .35s cubic-bezier(.4,0,.2,1);}
  .panel.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  .day-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:11px;font-weight:700;font-size:12.5px;letter-spacing:.3px;text-transform:uppercase;color:#0b0e12;box-shadow:var(--shadow);}
  .pill-torsoA{background:linear-gradient(135deg,var(--torsoA-l),var(--torsoA));}
  .pill-legsA{background:linear-gradient(135deg,var(--legsA-l),var(--legsA));}
  .pill-torsoB{background:linear-gradient(135deg,var(--torsoB-l),var(--torsoB));}
  .pill-legsB{background:linear-gradient(135deg,var(--legsB-l),var(--legsB));}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .dot-torsoA{background:var(--torsoA);} .dot-legsA{background:var(--legsA);}
  .dot-torsoB{background:var(--torsoB);} .dot-legsB{background:var(--legsB);}

  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  select.day-select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 9px;font-size:12.5px;}

  .ex-block{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .ex-name{font-weight:600;font-size:15px;}
  .ex-target{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--dim);white-space:nowrap;}
  .ex-note{font-size:11.5px;color:var(--dim);margin-bottom:11px;}
  .set-row{display:grid;grid-template-columns:20px 1fr 1fr 36px 32px;gap:6px;align-items:center;margin-bottom:7px;}
  .set-row .snum{font-family:'JetBrains Mono',monospace;color:var(--dim2);font-size:12px;text-align:center;}
  .set-row input{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 6px;font-family:'JetBrains Mono',monospace;font-size:13.5px;text-align:center;transition:border-color .15s;}
  .ok-btn{width:36px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--dim);font-size:14px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;transition:transform .1s,background .15s,border-color .15s,color .15s;}
  .ok-btn:active{transform:scale(.92);}
  .ok-btn.on{background:linear-gradient(135deg,var(--legsA-l),var(--legsA));border-color:transparent;color:#0b0e12;}
  .set-row.done{opacity:.85;}
  .set-row.done input{border-color:var(--legsA);}
  .fail-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--dim);font-size:12px;font-weight:700;}
  .fail-btn.on{background:var(--red);border-color:transparent;color:#2f0f0d;}
  .fail-slot{width:32px;}
  .set-actions{display:flex;gap:8px;margin-top:8px;}
  .set-actions button{flex:1;padding:7px 0;font-size:11.5px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);color:var(--dim);}
  .prev-line{font-size:11px;color:var(--dim2);margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);font-family:'JetBrains Mono',monospace;}

  .finish-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,rgba(15,17,21,0),var(--bg) 30%);padding:18px 20px 20px;z-index:30;}
  .finish-bar-inner{max-width:520px;margin:0 auto;}
  .finish-btn{width:100%;padding:14px 0;border-radius:12px;border:none;background:linear-gradient(135deg,var(--torsoA-l),var(--torsoA));color:#0b0e12;font-weight:700;font-size:14.5px;box-shadow:0 6px 20px rgba(124,155,196,.22);}

  .summary-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .stars{font-size:24px;letter-spacing:4px;background:linear-gradient(135deg,var(--legsB-l),var(--legsB));-webkit-background-clip:text;background-clip:text;color:transparent;margin:8px 0 12px;}
  .stars .off{color:var(--surface-3);-webkit-text-fill-color:var(--surface-3);}
  .tip-item, .pos-item{font-size:13px;padding:9px 11px;border-radius:9px;margin-bottom:7px;line-height:1.45;}
  .tip-item{background:rgba(207,133,128,.13);color:#e8b8b3;}
  .pos-item{background:rgba(139,189,143,.13);color:#b3d6b6;}
  .edit-link{font-size:12px;color:var(--dim);text-decoration:underline;background:none;border:none;cursor:pointer;margin-top:6px;}

  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .cal-nav button{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:7px 14px;font-size:16px;}
  .cal-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-size:10.5px;color:var(--dim2);text-align:center;padding-bottom:4px;}
  .cal-cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11.5px;color:var(--dim);gap:3px;cursor:pointer;transition:transform .12s;}
  .cal-cell:active{transform:scale(.94);}
  .cal-cell.empty{border:none;background:transparent;}
  .cal-cell.today{border-color:var(--torsoA);border-width:1.5px;}
  .cal-cell.logged{color:var(--text);}
  .cal-cell.dimmed{opacity:.35;}

  select.ex-picker{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:11px;font-size:14px;margin-bottom:16px;}
  .chart-wrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);}
  .chart-stats{display:flex;gap:10px;margin-top:14px;}
  .stat-box{flex:1;background:var(--surface-2);border-radius:10px;padding:10px 10px;text-align:center;}
  .stat-box .n{font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;}
  .stat-box .l{font-size:10.5px;color:var(--dim);margin-top:2px;}

  .hist-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);}
  .hist-top{display:flex;justify-content:space-between;align-items:center;}
  .hist-date{font-size:13px;font-weight:600;}
  .hist-stars{color:var(--legsB);font-size:13px;}
  .hist-detail{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12.5px;font-family:'JetBrains Mono',monospace;color:var(--dim);}
  .hist-detail.open{display:block;}
  .hist-detail div{margin-bottom:5px;}
  .hist-notes{font-family:'Inter',sans-serif;color:var(--dim);font-size:12px;margin-top:6px;font-style:italic;}

  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .overlay.active{display:flex;}
  .modal-card{background:var(--surface);border-radius:16px;padding:20px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
  .modal-card h3{font-family:'Bebas Neue',sans-serif;font-size:20px;margin:0 0 10px;letter-spacing:.4px;}
  .modal-close{width:100%;padding:11px 0;margin-top:14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:13px;}

  .rest-bar{position:fixed;bottom:88px;left:0;right:0;z-index:31;display:none;justify-content:center;padding:0 20px;}
  .rest-bar-inner{max-width:520px;width:100%;background:var(--surface-2);border:1px solid var(--torsoA);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);}
  .rest-text{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--torsoA-l);flex:1;}
  .rest-bar-inner button{background:var(--surface-3);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 11px;font-size:12px;}
  .timer-btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:30px;height:30px;color:var(--torsoA-l);font-size:14px;flex-shrink:0;}
  .ex-head-row{display:flex;align-items:center;gap:8px;}
  .suggest-line{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:8px;padding:7px 10px;margin:9px 0;font-size:11.5px;color:var(--dim);}
  .suggest-line button{background:var(--torsoA);border:none;color:#0b0e12;font-weight:700;border-radius:6px;padding:5px 10px;font-size:11px;}
  .pr-badge{display:inline-block;background:linear-gradient(135deg,var(--legsB-l),var(--legsB));color:#2c2107;font-weight:700;font-size:11px;padding:3px 9px;border-radius:6px;margin-bottom:7px;}
  .modal-actions{display:flex;gap:8px;margin-top:10px;}
  .modal-actions button{flex:1;padding:10px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:12.5px;font-weight:600;}
  .modal-actions .danger{border-color:var(--red);color:var(--red);}
  .edit-banner{background:rgba(212,184,122,.13);color:var(--legsB-l);font-size:12px;padding:9px 12px;border-radius:9px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .edit-banner button{background:none;border:none;color:var(--legsB-l);text-decoration:underline;font-size:12px;}
  .week-vol-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:16px;box-shadow:var(--shadow);}
  .week-vol-title{font-size:12.5px;color:var(--dim);margin-bottom:10px;}
  .empty-note{color:var(--dim);font-size:13px;text-align:center;padding:32px 10px;}
  .rest-msg{text-align:center;padding:44px 20px;color:var(--dim);font-size:14px;}
  .rest-msg .big{font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--text);display:block;margin-bottom:8px;}
  .textarea-notes{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 11px;font-size:13px;resize:none;margin-top:6px;}
  .free-log-btn{display:block;text-align:center;margin-top:14px;padding:11px 0;border:1px dashed var(--line);border-radius:10px;color:var(--dim);font-size:13px;}

  /* ── Tabs: ajuste para 5 tabs ── */
  .tabs{gap:4px;}
  .tab{padding:8px 1px;font-size:10.5px;}

  /* ── Heatmap (estilo GitHub) ── */
  .heatmap-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);overflow-x:auto;}
  .heatmap-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
  .hm-nav-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;}
  .hm-nav-btn:active{transform:scale(.92);}
  .hm-year{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--text);min-width:60px;text-align:center;}
  .heatmap-grid{display:flex;flex-direction:column;gap:2px;margin-top:8px;}
  .heatmap-row{display:flex;align-items:center;gap:6px;}
  .dow-label{width:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--dim2);text-align:center;flex-shrink:0;}
  .heatmap-row-cells{display:grid;grid-template-columns:repeat(53,11px);grid-auto-rows:11px;gap:2px;}
  .heatmap-cell{width:11px;height:11px;border-radius:2px;background:var(--surface-3);}
  .heatmap-cell.heat-empty{visibility:hidden;}
  .heat-0{background:var(--surface-3);}
  .heat-1{background:rgba(139,189,143,.25);}
  .heat-2{background:rgba(139,189,143,.5);}
  .heat-3{background:rgba(139,189,143,.75);}
  .heat-4{background:rgba(139,189,143,1);}
  .heat-legend{display:flex;align-items:center;gap:4px;font-size:10.5px;color:var(--dim);justify-content:flex-end;margin-top:8px;}
  .heat-legend span{width:11px;height:11px;border-radius:2px;display:inline-block;}
  .heatmap-months{display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);margin-bottom:4px;padding-left:20px;}

  /* ── Stat cards (KPIs) ── */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
  .stat-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 11px;text-align:center;box-shadow:var(--shadow);}
  .stat-card .big{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.8px;color:var(--text);line-height:1;}
  .stat-card .lbl{font-size:10.5px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.5px;}
  .stat-card.positive .big{color:var(--green);}
  .stat-card.warning .big{color:var(--amber);}

  /* ── PR cards ── */
  .pr-card{background:linear-gradient(135deg,var(--surface),var(--surface-2));border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow);}
  .pr-card.new{border-color:var(--green);box-shadow:0 0 0 1px rgba(139,189,143,.3),var(--shadow);}
  .pr-card .name{font-weight:600;font-size:14px;}
  .pr-card .meta{font-size:11.5px;color:var(--dim);margin-top:3px;font-family:'JetBrains Mono',monospace;}
  .pr-card .badge{background:var(--green);color:#0b0e12;font-size:10px;font-weight:700;padding:4px 8px;border-radius:7px;letter-spacing:.5px;}
  .pr-card .v{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:18px;color:var(--torsoA-l);}

  /* ── Toast notifications ── */
  .toast{position:fixed;bottom:90px;right:18px;background:var(--surface);border:1px solid var(--green);border-radius:11px;padding:13px 16px;font-size:13px;box-shadow:var(--shadow-lg);z-index:50;max-width:300px;animation:toastIn .3s ease-out;}
  .toast.warning{border-color:var(--amber);}
  .toast.error{border-color:var(--red);}
  .toast.info{border-color:var(--torsoA);}
  @keyframes toastIn{from{transform:translateX(100%);opacity:0;}to{transform:translateX(0);opacity:1;}}
  .toast.fadeout{animation:toastOut .3s ease-in forwards;}
  @keyframes toastOut{to{transform:translateX(100%);opacity:0;}}

  /* ── Compare table (lado a lado) ── */
  .compare-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px;}
  .compare-table th{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;}
  .compare-table td{padding:9px 8px;border-bottom:1px solid var(--line-soft);font-family:'JetBrains Mono',monospace;}
  .compare-table .delta-up{color:var(--green);font-weight:600;}
  .compare-table .delta-down{color:var(--red);font-weight:600;}
  .compare-table .delta-same{color:var(--dim);}

  /* ── Selector de fechas para compare ── */
  .date-picker-row{display:flex;gap:8px;margin-bottom:14px;}
  .date-picker-row select{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px;font-size:13px;}

  /* ── Suggestion box ── */
  .suggestion-box{background:linear-gradient(135deg,rgba(139,189,143,.12),rgba(124,155,196,.08));border:1px solid var(--green);border-radius:13px;padding:14px;margin:14px 0;display:flex;align-items:center;gap:12px;}
  .suggestion-box.deload{border-color:var(--amber);background:linear-gradient(135deg,rgba(212,184,122,.12),rgba(207,133,128,.08));}
  .suggestion-box .icon{font-size:24px;}
  .suggestion-box .txt{flex:1;font-size:13px;line-height:1.4;}
  .suggestion-box .txt strong{color:var(--green);font-family:'JetBrains Mono',monospace;}
  .suggestion-box.deload .txt strong{color:var(--amber);}

  /* ── Controls compact (métrica + rango en Progreso) ── */
  .ctrl-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .ctrl-row select{background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;font-size:12px;flex:1;min-width:90px;}

  /* ── Modal de stats ── */
  .modal-section{margin-bottom:18px;}
  .modal-section h3{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;margin:0 0 10px;color:var(--dim);text-transform:uppercase;}

  /* ── Mini chip (PR tag en lista) ── */
  .mini-chip{display:inline-block;background:var(--surface-3);color:var(--dim);font-size:10px;padding:2px 7px;border-radius:6px;margin-left:6px;font-family:'JetBrains Mono',monospace;}

  /* ── Action button group ── */
  .action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px;}
  .action-btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;color:var(--text);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}

  .chart-wrap{margin-top:8px;}
  .chart-axis{font-size:9.5px;fill:var(--dim2);}
  .chart-grid-line{stroke:var(--line-soft);stroke-width:1;stroke-dasharray:2,3;}

  /* ── Sparkline ── */
  .sparkline{display:inline-block;vertical-align:middle;}

  /* ── Reducir scroll horizontal accidental ── */
  html, body { overflow-x: hidden; }

  /* ════════════════════════════════════════════════════════════
     PWA — refinamientos profesionales + adaptación Pixel 8a
     ════════════════════════════════════════════════════════════ */

  /* ── Tipografía más generosa (gym = leer de un vistazo) ── */
  .ex-name{font-size:16px;}
  .hist-date{font-size:14px;}
  .panel{padding:20px;}
  .ex-block{padding:20px 18px;border-radius:18px;}
  .day-pill{padding:7px 16px;font-size:13px;}

  /* ── Touch targets ≥ 44px (estándar Apple HIG / Material) ── */
  .tab,.action-btn,button{min-height:44px;}
  .set-row input{min-height:44px;font-size:15px;padding:11px 6px;}
  .ok-btn{width:40px;height:40px;font-size:15px;}
  .fail-btn{width:40px;height:40px;}
  .cal-cell{min-height:48px;}
  .cal-nav button{padding:8px 16px;}
  .modal-actions button{padding:12px 0;}
  .finish-btn{padding:16px 0;font-size:15px;}

  /* ── Micro-animaciones profesionales ── */
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .ex-block{transition:transform .2s var(--ease),border-color .2s var(--ease);}
  .ex-block:active{transform:scale(.995);}
  .action-btn{transition:all .15s var(--ease);}
  .action-btn:active{transform:scale(.97);background:var(--surface-2);}
  .tab,.bn-item{transition:color .2s var(--ease),background .2s var(--ease),transform .12s var(--ease);}
  .set-row input{transition:border-color .15s var(--ease),box-shadow .15s var(--ease),background .15s var(--ease);}
  .finish-btn{transition:transform .12s var(--ease),box-shadow .2s var(--ease);}
  .finish-btn:active{transform:scale(.98);}

  /* ── Reduced motion (accesibilidad) ── */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;}
  }

  /* ── Safe areas (notch + barra gestos Pixel 8a) ── */
  @supports(padding: max(0px)){
    .head{padding-left:max(20px, env(safe-area-inset-left));padding-right:max(20px, env(safe-area-inset-right));}
    .tabs,.finish-bar-inner,.panel{padding-left:max(20px, env(safe-area-inset-left));padding-right:max(20px, env(safe-area-inset-right));}
  }

  /* ════════════════════════════════════════════════════════════
     Bottom navigation — estilo app nativa móvil
     ════════════════════════════════════════════════════════════ */
  .bottom-nav{
    display:none;
    position:fixed;
    bottom:0;left:0;right:0;
    background:rgba(20,24,34,.92);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-top:1px solid var(--line);
    padding:6px 0 calc(6px + env(safe-area-inset-bottom));
    z-index:35;
    justify-content:space-around;
    box-shadow:0 -2px 24px rgba(0,0,0,.35);
  }
  .bn-item{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:8px 4px;
    color:var(--dim);
    font-size:10.5px;
    font-weight:600;
    letter-spacing:.3px;
    background:none;
    border:none;
    cursor:pointer;
    border-radius:10px;
    transition:color .2s var(--ease),transform .12s var(--ease);
    min-width:0;
  }
  .bn-item svg{width:23px;height:23px;stroke:var(--dim);transition:stroke .2s var(--ease);}
  .bn-item.active{color:var(--torsoA-l);}
  .bn-item.active svg{stroke:var(--torsoA-l);}
  .bn-item:active{transform:scale(.92);}

  /* ── Visibilidad por breakpoint ── */
  @media (max-width: 768px){
    .tabs{display:none;}
    .bottom-nav{display:flex;}
    .finish-bar{bottom:64px;}
    .rest-bar{bottom:140px;}
    .app{padding-bottom:170px;}
  }

  /* ════════════════════════════════════════════════════════════
     Banner "Instalar app" — PWA install prompt
     ════════════════════════════════════════════════════════════ */
  .install-banner{
    position:fixed;
    top:14px;left:14px;right:14px;
    background:var(--surface);
    border:1px solid var(--torsoA);
    border-radius:14px;
    padding:12px 14px;
    display:flex;justify-content:space-between;align-items:center;
    z-index:40;
    box-shadow:var(--shadow-lg);
    transform:translateY(-180%);

    max-width:520px;
    margin:0 auto;
  }
  .install-banner.visible{transform:translateY(0);}
  .install-text strong{display:block;font-size:13.5px;color:var(--text);}
  .install-text small{display:block;color:var(--dim);font-size:11px;margin-top:2px;}
  .install-actions{display:flex;gap:6px;flex-shrink:0;}

  }
  .install-actions .ib-install{
    background:linear-gradient(135deg,var(--torsoA-l),var(--torsoA));
    color:#0b0e12;border-color:transparent;
  }
</style>

// ── Storage ────────────────────────────────────────────────────
// Capa de almacenamiento con auto-recuperación:
// - Si window.storage nativo de Claude no existe, usamos localStorage desde el principio.
// - Si SÍ existe pero falla al usarlo, cambiamos automáticamente a localStorage
//   sin bloquear la app ni perder lo que se intentó guardar.
// - `migrate` convierte sesiones v1 (sin `v`) a v2 (con `rpe`, `dropSet` opcional).
const STORAGE = (() => {
  const NATIVE_STORAGE = (typeof window.storage !== 'undefined') ? window.storage : null;
  let useNative = !!NATIVE_STORAGE;
  let nativeFailNoted = false;

  function lsGetRaw(key){
    const raw = localStorage.getItem(LS_PREFIX + key);
    if (raw === null) throw new Error('key not found: ' + key);
    return raw;
  }
  function isNotFoundError(e){
    const msg = String((e && e.message) || e || '').toLowerCase();
    return msg.includes('not found');
  }
  function noteNativeFailure(e){
    if (!nativeFailNoted){
      console.error('El almacenamiento nativo falló, cambiando a modo local', e);
      nativeFailNoted = true;
    }
    useNative = false;
  }

  async function get(key, shared){
    if (useNative){
      try { return await NATIVE_STORAGE.get(key, shared); }
      catch (e){
        if (isNotFoundError(e)) throw e;
        noteNativeFailure(e);
      }
    }
    return { key, value: lsGetRaw(key), shared: !!shared };
  }
  async function set(key, value, shared){
    if (useNative){
      try {
        const result = await NATIVE_STORAGE.set(key, value, shared);
        // SIEMPRE escribir también en localStorage como fallback para evitar
        // pérdida de datos si el nativo falla después o se desincroniza
        try { localStorage.setItem(LS_PREFIX + key, value); } catch(e){}
        return result;
      }
      catch (e){ noteNativeFailure(e); }
    }
    localStorage.setItem(LS_PREFIX + key, value);
    return { key, value, shared: !!shared };
  }
  async function del(key, shared){
    if (useNative){
      try { return await NATIVE_STORAGE.delete(key, shared); }
      catch (e){ noteNativeFailure(e); }
    }
    localStorage.removeItem(LS_PREFIX + key);
    STATE.sessionsCache = null;
    return { key, deleted: true, shared: !!shared };
  }
  async function list(prefix, shared){
    if (useNative){
      try { return await NATIVE_STORAGE.list(prefix, shared); }
      catch (e){ noteNativeFailure(e); }
    }
    const keys = [];
    for (let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if (k && k.startsWith(LS_PREFIX)){
        const short = k.slice(LS_PREFIX.length);
        if (!prefix || short.startsWith(prefix)) keys.push(short);
      }
    }
    return { keys, prefix, shared: !!shared };
  }

  // ── Migración v1 → v2 ──
  function migrate(raw){
    if (!raw || typeof raw !== 'object') return raw;
    if (raw.v === SCHEMA_VERSION) return raw;
    const migrated = { ...raw, v: SCHEMA_VERSION };
    if (!migrated.rpe) migrated.rpe = {};
    if (Array.isArray(migrated.entries)){
      migrated.entries = migrated.entries.map(entry => {
        if (!entry || !Array.isArray(entry.sets)) return entry;
        if (entry.dropSet) return entry; // ya marcado
        const decreasing = entry.sets.length >= 3 &&
          entry.sets.every((s, i) => i === 0 || s.weight < entry.sets[i - 1].weight);
        return { ...entry, dropSet: !!decreasing };
      });
    }
    return migrated;
  }

  // ── Helpers de alto nivel ──
  async function getSession(dk){
    try {
      const r = await get('session:' + dk, false);
      if (!r) return null;
      const session = migrate(JSON.parse(r.value));
      // Reescribir silenciosamente si la sesión estaba en v1
      if (!r.value.startsWith('{"v":')) saveSession(dk, session).catch(()=>{});
      return session;
    } catch (e){ return null; }
  }
  async function saveSession(dk, session){
    const v2 = session.v === SCHEMA_VERSION ? session : migrate(session);
    await set('session:' + dk, JSON.stringify(v2), false);
    STATE.sessionsCache = null;
  }
  async function getAllSessions(force){
    if (STATE.sessionsCache && !force) return STATE.sessionsCache;
    try {
      const keysList = await list('session:', false);
      if (!keysList || !keysList.keys || keysList.keys.length === 0){
        STATE.sessionsCache = [];
        return [];
      }
      const out = [];
      for (const rawKey of keysList.keys){
        const fullKey = rawKey.startsWith('session:') ? rawKey : 'session:' + rawKey;
        const shortKey = rawKey.startsWith('session:') ? rawKey.slice('session:'.length) : rawKey;
        try {
          const r = await get(fullKey, false);
          if (r && r.value){
            const parsed = JSON.parse(r.value);
            out.push({ key: shortKey, data: migrate(parsed) });
          }
        } catch (e){
          console.error('No se pudo leer', fullKey, e);
          out.push({ key: shortKey, data: null, corrupted: true });
        }
      }
      out.sort((a, b) => a.key < b.key ? 1 : -1);
      STATE.sessionsCache = out;
      return out;
    } catch (e){
      console.error('getAllSessions falló', e);
      return STATE.sessionsCache || [];
    }
  }

  // ── Drafts (borradores) ──
  async function getDraft(dk){
    try {
      const r = await get('draft:' + dk, false);
      return r ? JSON.parse(r.value) : null;
    } catch (e){ return null; }
  }
  async function saveDraft(dk){
    try {
      await set('draft:' + dk, JSON.stringify({
        dayType: STATE.form.day,
        data: STATE.form.data,
        notes: STATE.form.notes,
        rpe: STATE.form.rpe,
        groupedWeight: STATE.form.groupedWeight,
        dropSetRounds: STATE.form.dropSetRounds
      }), false);
    } catch (e){ console.error('No se pudo autoguardar el borrador', e); }
  }
  async function clearDraft(dk){
    try { await del('draft:' + dk, false); } catch (e){}
  }

  // ── Salud ──
  async function healthCheck(){
    const banner = document.getElementById('storageWarning');
    try {
      const testVal = String(Date.now());
      await set('meta:healthcheck', testVal, false);
      const r = await get('meta:healthcheck', false);
      if (!r || r.value !== testVal){
        banner.style.display = 'block';
        banner.style.background = 'rgba(207,133,128,.15)';
        banner.style.color = '#e8b8b3';
        banner.textContent = '⚠️ El guardado no está respondiendo como se espera. Cierra y vuelve a abrir esta app.';
        return false;
      }
      // localStorage persiste los datos siempre (modo normal de navegador).
      // No se muestra banner informativo — el guardado es fiable y silencioso.
      return true;
    } catch (e){
      banner.style.display = 'block';
      banner.style.background = 'rgba(207,133,128,.15)';
      banner.style.color = '#e8b8b3';
      banner.textContent = '⚠️ Este navegador no permite guardar datos (por ejemplo, modo incógnito).';
      return false;
    }
  }

  return { get, set, del, list, migrate, getSession, saveSession, getAllSessions, getDraft, saveDraft, clearDraft, healthCheck };
})();

// ── Lógica de dominio (pura, sin DOM ni storage) ──────────────
const DOMAIN = (() => {
  function dateKey(d){
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function nextDayType(last){
    const i = SEQUENCE.indexOf(last);
    return SEQUENCE[(i+1) % SEQUENCE.length];
  }
  function parseRestSeconds(restStr){
    const m = (restStr || '').match(/(\d+)\s*(min|seg)/);
    if (!m) return 60;
    const v = parseInt(m[1]);
    return m[2] === 'min' ? v * 60 : v;
  }
  function roundToStep(val, step){
    return Math.round(val / step) * step;
  }
  function calcSuggestion(ex, last){
    if (!last) return null;
    const prevMax = Math.max(...last.entry.sets.map(s => s.weight));
    const prevReps = last.entry.sets.map(s => s.reps);
    const m = ex.reps && ex.reps.match(/(\d+)-(\d+)/);
    if (m){
      const top = parseInt(m[2]);
      if (prevReps.length && prevReps.every(r => r >= top)){
        return { weight: roundToStep(prevMax * 1.05, prevMax < 20 ? 1.25 : 2.5), text: `llegaste a ${top}+ reps en todas las series` };
      }
    }
    return { weight: prevMax, text: 'mantén la misma carga que la última vez' };
  }
  function exDefById(id){
    for (const day in ROUTINES){
      const f = ROUTINES[day].find(e => e.id === id);
      if (f) return f;
    }
    return null;
  }
  function capitalize(s){
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function lastEntryFor(sessions, exId){
    for (const s of sessions){
      const f = (s.data && s.data.entries || []).find(e => e.exId === exId);
      if (f) return { date: s.key, entry: f };
    }
    return null;
  }
  function allTimeMaxByExId(sessions, excludeKey){
    const map = {};
    sessions.forEach(s => {
      if (s.key === excludeKey) return;
      (s.data.entries || []).forEach(e => {
        if (!e.sets || !e.sets.length) return;
        const m = Math.max(...e.sets.map(x => x.weight));
        if (!(e.exId in map) || m > map[e.exId]) map[e.exId] = m;
      });
    });
    return map;
  }
  function generateFeedback(entries, prevByExId, allTimeMax){
    allTimeMax = allTimeMax || {};
    let stars = 5;
    const tips = [];
    const positives = [];
    entries.forEach(entry => {
      const ex = exDefById(entry.exId);
      const weights = entry.sets.map(s => s.weight);
      const reps = entry.sets.map(s => s.reps);
      const uniqueWeights = new Set(weights);
      const isRamp = weights.every((w, i) => i === 0 || w >= weights[i - 1]);
      if (uniqueWeights.size > 1 && !isRamp){
        tips.push(`${entry.exName}: el peso sube y baja entre series (${weights.join('/')}) sin un patrón claro — o mantén la misma carga en las series de trabajo, o haz una rampa ascendente hasta la última.`);
        stars -= 0.5;
      }
      if (ex && ex.failRule === 'none' && entry.sets.some(s => s.fallo)){
        tips.push(`${entry.exName}: fallo marcado en un ejercicio técnico — evítalo por riesgo de lesión.`);
        stars -= 1;
      }
      if (ex && ex.reps && ex.reps.includes('-')){
        const m = ex.reps.match(/(\d+)-(\d+)/);
        if (m){
          const top = parseInt(m[2]);
          if (reps.length && reps.every(r => r >= top)){
            tips.push(`${entry.exName}: todas las series llegaron a ${top}+ reps — probablemente puedes subir peso la próxima vez.`);
          }
        }
      }
      const curMax = Math.max(...weights);
      const prev = prevByExId[entry.exId];
      if (prev && prev.sets && prev.sets.length){
        const prevMax = Math.max(...prev.sets.map(s => s.weight));
        if (prevMax > 0){
          const pct = (curMax - prevMax) / prevMax;
          if (pct > 0.15){
            tips.push(`${entry.exName}: subida de más del 15% respecto a la sesión anterior (${prevMax}→${curMax}kg) — consolida antes de seguir subiendo.`);
            stars -= 0.5;
          } else if (curMax > prevMax){
            positives.push(`${entry.exName}: progreso de ${prevMax}kg a ${curMax}kg.`);
          } else if (curMax < prevMax){
            tips.push(`${entry.exName}: bajaste peso respecto a la última vez (${prevMax}→${curMax}kg) — vigila descanso y recuperación.`);
          }
        }
      }
      const bestPrior = allTimeMax[entry.exId];
      if (bestPrior !== undefined && curMax > bestPrior){
        positives.push(`🏆 Nuevo PR en ${entry.exName}: ${curMax}kg (anterior ${bestPrior}kg).`);
      }
    });
    stars = Math.max(1, Math.min(5, Math.round(stars * 2) / 2));
    if (tips.length === 0) positives.unshift('Ejecución sólida: cargas constantes y sin banderas rojas.');
    return { stars, tips, positives };
  }
  function compareWithLast(entries, lastSession){
    if (!lastSession || !lastSession.entries) return [];
    const out = [];
    entries.forEach(e => {
      const prev = lastSession.entries.find(p => p.exId === e.exId);
      if (!prev || !prev.sets || !prev.sets.length) return;
      const curMax = Math.max(...e.sets.map(s => s.weight));
      const prevMax = Math.max(...prev.sets.map(s => s.weight));
      if (prevMax === 0) return;
      const delta = Math.round(((curMax - prevMax) / prevMax) * 100);
      out.push({
        exName: e.exName,
        current: e.sets.length + '×' + curMax + 'kg',
        previous: prev.sets.length + '×' + prevMax + 'kg',
        deltaPct: delta
      });
    });
    return out;
  }
  function streakCalculator(sessions){
    if (!sessions.length) return 0;
    const sorted = sessions.slice().sort((a, b) => a.key < b.key ? -1 : 1);
    let streak = 0;
    let prevDate = null;
    for (const s of sorted){
      const d = new Date(s.key + 'T00:00:00');
      if (prevDate){
        const diffDays = Math.round((d - prevDate) / (1000 * 60 * 60 * 24));
        if (diffDays > 2) break; // gap > 1 día de descanso rompe racha
      }
      streak++;
      prevDate = d;
    }
    return streak;
  }
  function monthlyStats(sessions, year, month){
    const byWeek = [0, 0, 0, 0, 0, 0];
    let torso = 0, legs = 0, total = 0;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    sessions.forEach(s => {
      const d = new Date(s.key + 'T00:00:00');
      if (d.getFullYear() !== year || d.getMonth() !== month) return;
      const day = d.getDate();
      const weekIdx = Math.floor((day - 1) / 7);
      byWeek[weekIdx] = (byWeek[weekIdx] || 0) + 1;
      total++;
      if (s.data && s.data.dayType && s.data.dayType.startsWith('Torso')) torso++;
      else if (s.data && s.data.dayType && s.data.dayType.startsWith('Legs')) legs++;
    });
    return { byWeek, torso, legs, total };
  }
  function formatDuration(seconds){
    const m = Math.floor(seconds / 60);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60);
    const rest = m % 60;
    return rest ? `${h}h ${rest}m` : `${h}h`;
  }
  function estimateDuration(entries, exDefs){
    let seconds = 0;
    entries.forEach(entry => {
      const ex = exDefs.find(e => e.id === entry.exId);
      if (!ex) return;
      const rest = parseRestSeconds(ex.rest);
      seconds += rest * Math.max(0, entry.sets.length - 1);
      seconds += 30 * entry.sets.length; // tiempo medio por serie
    });
    return seconds;
  }
  function inferDropSets(entries){
    return entries.map(entry => {
      if (!entry || !entry.sets || entry.sets.length < 3) return entry;
      if (entry.dropSet) return entry;
      const decreasing = entry.sets.every((s, i) => i === 0 || s.weight < entry.sets[i - 1].weight);
      return { ...entry, dropSet: !!decreasing };
    });
  }

  // ── 1RM estimado (fórmulas) ──
  function epley1RM(weight, reps){
    if (!weight || !reps || reps < 1) return 0;
    if (reps === 1) return weight;
    return Math.round((weight * (1 + reps / 30)) * 10) / 10;
  }
  function brzycki1RM(weight, reps){
    if (!weight || !reps || reps < 1) return 0;
    if (reps === 1) return weight;
    if (reps >= 37) return weight;
    return Math.round((weight * 36 / (37 - reps)) * 10) / 10;
  }
  function best1RM(weight, reps){
    if (reps <= 10) return brzycki1RM(weight, reps);
    return epley1RM(weight, reps);
  }

  // ── Volumen (peso × reps × sets) ──
  function volumeOfEntry(entry){
    if (!entry || !entry.sets) return 0;
    return entry.sets.reduce((acc, s) => acc + (s.weight || 0) * (s.reps || 0), 0);
  }
  function volumeOfSession(session){
    if (!session || !session.entries) return 0;
    return session.entries.reduce((acc, e) => acc + volumeOfEntry(e), 0);
  }

  // ── Récord personal (peso máximo) por ejercicio ──
  function prByExId(sessions){
    const map = {};
    sessions.forEach(s => {
      (s.data.entries || []).forEach(e => {
        if (!e.sets || !e.sets.length) return;
        const m = Math.max(...e.sets.map(x => x.weight));
        if (!(e.exId in map) || m > map[e.exId].weight){
          map[e.exId] = { weight: m, date: s.key, exName: e.exName };
        }
      });
    });
    return map;
  }

  // ── 1RM máximo histórico por ejercicio ──
  function best1RMByExId(sessions){
    const map = {};
    sessions.forEach(s => {
      (s.data.entries || []).forEach(e => {
        if (!e.sets || !e.sets.length) return;
        e.sets.forEach(st => {
          const rm = best1RM(st.weight, st.reps);
          if (!(e.exId in map) || rm > map[e.exId].oneRM){
            map[e.exId] = { oneRM: rm, date: s.key, exName: e.exName, weight: st.weight, reps: st.reps };
          }
        });
      });
    });
    return map;
  }

  // ── Detectar nuevos PRs comparando sesión actual vs histórico (excluyendo currentKey) ──
  function detectPRs(currentSession, allSessions){
    const newPRs = [];
    const currentKey = currentSession.key || currentSession.loggedAt;
    const historical = allSessions.filter(s => s.key !== currentKey);
    const priorBest = prByExId(historical);
    (currentSession.entries || []).forEach(e => {
      if (!e.sets || !e.sets.length) return;
      const curMax = Math.max(...e.sets.map(x => x.weight));
      const prior = priorBest[e.exId];
      if (!prior || curMax > prior.weight){
        newPRs.push({ exId: e.exId, exName: e.exName, weight: curMax, previous: prior ? prior.weight : 0, date: currentKey });
      }
    });
    return newPRs;
  }

  // ── Estancamiento: mismo peso objetivo en las últimas N sesiones ──
  function isStagnant(exId, sessions, lastN){
    if (lastN === undefined) lastN = 3;
    const appearances = [];
    sessions.forEach(s => {
      if (s.key === undefined) return;
      const e = (s.data.entries || []).find(x => x.exId === exId);
      if (e && e.sets && e.sets.length){
        const m = Math.max(...e.sets.map(x => x.weight));
        appearances.push({ date: s.key, weight: m });
      }
    });
    appearances.sort((a, b) => a.date < b.date ? 1 : -1);
    if (appearances.length < lastN) return false;
    const recent = appearances.slice(0, lastN);
    const first = recent[recent.length - 1].weight;
    return recent.every(a => a.weight === first);
  }

  // ── Doble progresión: sugerir siguiente sesión ──
  function nextSessionSuggestion(exId, sessions){
    const exDef = exDefById(exId);
    const appearances = [];
    sessions.forEach(s => {
      const e = (s.data.entries || []).find(x => x.exId === exId);
      if (e && e.sets && e.sets.length){
        const maxW = Math.max(...e.sets.map(x => x.weight));
        const maxR = Math.max(...e.sets.map(x => x.reps || 0));
        const failed = e.sets.some(x => x.fallo);
        appearances.push({ date: s.key, sets: e.sets, maxWeight: maxW, maxReps: maxR, failed });
      }
    });
    if (!appearances.length){
      return { weight: 0, targetReps: 8, isDeload: false, msg: 'Sin datos previos. Empieza con peso ligero y céntrate en la técnica.' };
    }
    appearances.sort((a, b) => a.date < b.date ? 1 : -1);
    const last = appearances[0];
    const targetReps = exDef && exDef.reps && exDef.reps.includes('-')
      ? parseInt(exDef.reps.split('-')[1]) || 8
      : 10;
    const repsMin = exDef && exDef.reps && exDef.reps.includes('-')
      ? parseInt(exDef.reps.split('-')[0])
      : Math.max(1, targetReps - 2);

    // Estancamiento: deload
    const stagnant = isStagnant(exId, sessions, 3);
    if (stagnant && appearances.length >= 3){
      const deloadWeight = Math.round(last.maxWeight * 0.9 * 2) / 2;
      return {
        weight: deloadWeight,
        targetReps: targetReps + 2,
        isDeload: true,
        msg: `Llevas 3 sesiones al mismo peso (${last.maxWeight}kg). Prueba deload: ${deloadWeight}kg · ${targetReps + 2} reps para resetear.`
      };
    }

    // Falló la última → repetir peso
    if (last.failed){
      return {
        weight: last.maxWeight,
        targetReps: targetReps,
        isDeload: false,
        msg: `La última vez fallaste. Repite ${last.maxWeight}kg intentando completar ${targetReps} reps en todas las series.`
      };
    }

    // Completó reps objetivo en todas las series → +1 rep próxima sesión
    const allSetsMetTarget = last.sets.length > 0 && last.sets.every(s => (s.reps || 0) >= targetReps);
    if (allSetsMetTarget){
      return {
        weight: last.maxWeight,
        targetReps: targetReps + 1,
        isDeload: false,
        msg: `Mantén ${last.maxWeight}kg e intenta +1 rep en cada serie (objetivo: ${targetReps + 1}).`
      };
    }

    // Reps mejoradas vs objetivo mínimo → +2.5kg
    const allAboveMin = last.sets.every(s => (s.reps || 0) >= repsMin);
    if (allAboveMin){
      const step = last.maxWeight < 20 ? 1.25 : 2.5;
      const newW = Math.round((last.maxWeight + step) * 2) / 2;
      return {
        weight: newW,
        targetReps: repsMin,
        isDeload: false,
        msg: `Sube a ${newW}kg empezando por ${repsMin} reps. La carga anterior ${last.maxWeight}kg ya está consolidada.`
      };
    }

    return {
      weight: last.maxWeight,
      targetReps: repsMin,
      isDeload: false,
      msg: `Repite ${last.maxWeight}kg · ${repsMin}-${targetReps} reps para consolidar la carga.`
    };
  }

  // ── Heatmap data: sesiones por día del año (estilo GitHub) ──
  function heatmapData(sessions, year){
    const map = {};
    sessions.forEach(s => {
      const d = new Date(s.key + 'T00:00:00');
      if (d.getFullYear() !== year) return;
      map[s.key] = (map[s.key] || 0) + 1;
    });
    const out = [];
    const cursor = new Date(year, 0, 1);
    const endOfYear = new Date(year, 11, 31);
    while (cursor <= endOfYear){
      const k = dateKey(cursor);
      const count = map[k] || 0;
      let level = 0;
      if (count === 1) level = 2;
      else if (count >= 2) level = 4;
      out.push({ date: k, level, count });
      cursor.setDate(cursor.getDate() + 1);
    }
    return out;
  }

  // ── Streak: racha actual y mejor racha ──
  function streakInfo(sessions){
    if (!sessions.length) return { current: 0, best: 0 };
    const dates = [...new Set(sessions.map(s => s.key))].sort();
    let best = 1;
    for (let i = 1; i < dates.length; i++){
      const prev = new Date(dates[i - 1] + 'T00:00:00');
      const cur2 = new Date(dates[i] + 'T00:00:00');
      const diff = Math.round((cur2 - prev) / (1000 * 60 * 60 * 24));
      if (diff <= 2){
        best++;
      } else {
        best = Math.max(best, 1);
      }
    }
    let current = 1;
    for (let i = dates.length - 2; i >= 0; i--){
      const prev = new Date(dates[i] + 'T00:00:00');
      const cur2 = new Date(dates[i + 1] + 'T00:00:00');
      const diff = Math.round((cur2 - prev) / (1000 * 60 * 60 * 24));
      if (diff <= 2) current++;
      else break;
    }
    const lastDate = dates[dates.length - 1];
    const today = dateKey(new Date());
    const todayD = new Date(today + 'T00:00:00');
    const lastD = new Date(lastDate + 'T00:00:00');
    const gap = Math.round((todayD - lastD) / (1000 * 60 * 60 * 24));
    if (gap > 2) current = 0;
    return { current, best: Math.max(best, current) };
  }

  // ── Comparar dos sesiones: diff por ejercicio ──
  function compareSessions(sessionA, sessionB){
    const out = [];
    if (!sessionA || !sessionB) return out;
    const exIds = new Set([
      ...(sessionA.entries || []).map(e => e.exId),
      ...(sessionB.entries || []).map(e => e.exId)
    ]);
    exIds.forEach(exId => {
      const ea = (sessionA.entries || []).find(e => e.exId === exId);
      const eb = (sessionB.entries || []).find(e => e.exId === exId);
      const exName = (ea || eb).exName;
      const maxW = (sets) => sets && sets.length ? Math.max(...sets.map(s => s.weight || 0)) : 0;
      const totalReps = (sets) => sets ? sets.reduce((acc, s) => acc + (s.reps || 0), 0) : 0;
      const topA = ea ? maxW(ea.sets) : 0;
      const topB = eb ? maxW(eb.sets) : 0;
      const repsA = ea ? totalReps(ea.sets) : 0;
      const repsB = eb ? totalReps(eb.sets) : 0;
      const volA = ea ? volumeOfEntry(ea) : 0;
      const volB = eb ? volumeOfEntry(eb) : 0;
      out.push({
        exId, exName,
        topA, topB,
        repsA, repsB,
        volA, volB,
        deltaTop: Math.round((topB - topA) * 10) / 10,
        deltaVol: Math.round(volB - volA)
      });
    });
    return out;
  }

  // ── Lista de sesiones estructuradas (para selector de compare) ──
  function sortedSessions(sessions){
    return sessions.slice().sort((a, b) => a.key < b.key ? 1 : -1);
  }

  return {
    dateKey, nextDayType, parseRestSeconds, calcSuggestion, exDefById, capitalize,
    lastEntryFor, allTimeMaxByExId, generateFeedback, compareWithLast,
    streakCalculator, monthlyStats, formatDuration, estimateDuration, inferDropSets,
    epley1RM, brzycki1RM, best1RM, volumeOfEntry, volumeOfSession,
    prByExId, best1RMByExId, detectPRs, isStagnant, nextSessionSuggestion,
    heatmapData, streakInfo, compareSessions, sortedSessions
  };
})();

      document.getElementById('finishBar').style.display = 'none';
      document.getElementById('sessionProgress').style.display = 'none';

    }

    // Borrador existente

    if (draft){
      STATE.form.day = draft.dayType;
      STATE.form.data = draft.data || {};
      STATE.form.notes = draft.notes || '';
      STATE.form.rpe = draft.rpe || {};
      STATE.form.groupedWeight = draft.groupedWeight || {};
      STATE.form.dropSetRounds = draft.dropSetRounds || {};

      return;

    // Sesión nueva: día recomendado

    STATE.form.day = recommended;
    STATE.form.data = {};
    ROUTINES[recommended].forEach(ex => {
      STATE.form.data[ex.id] = Array.from({ length: ex.sets }, () => ({ reps: '', weight: '', fallo: false }));
    });
    STATE.form.notes = '';
    STATE.form.rpe = {};
    STATE.form.groupedWeight = {};
    STATE.form.dropSetRounds = {};

              <label style="color:var(--dim);font-size:12px;">series</label>

                ${Array.from({length: 10}, (_, i) => i + 1).map(n => `<option value="${n}" ${n === gw.count ? 'selected' : ''}>${n}</option>`).join('')}

  function renderRpeBlock(exId){

  function renderSetRows(exId, failRule){

    container.innerHTML = rows.map((s, i) => {
      const isLast = i === rows.length - 1;

  function renderMiniChart(exName, points){
    if (points.length < 2) return '';
    const w = 280, h = 40, pad = 4;
    const maxW = Math.max(...points.map(p => p.weight));
    const minW = Math.min(...points.map(p => p.weight));
    const range = Math.max(1, maxW - minW);
    const step = (w - 2 * pad) / (points.length - 1);
    const coords = points.map((p, i) => ({
      x: pad + i * step,
      y: h - pad - ((p.weight - minW) / range) * (h - 2 * pad)
    }));
    const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
    return `<div style="margin-bottom:8px;">
      <div style="font-size:11px;color:var(--dim);margin-bottom:2px;">${escapeHtml(exName)}</div>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
        <polyline points="${poly}" fill="none" stroke="var(--torsoA)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>`;
  }

  async function renderProgress(){

    sessions.slice().reverse().forEach(s => {
      const entry = (s.data && s.data.entries || []).find(e => e.exId === exId);
      if (entry && entry.sets && entry.sets.length){
        const maxW = Math.max(...entry.sets.map(x => x.weight));
        const vol = DOMAIN.volumeOfEntry(entry);
        const best1 = entry.sets.reduce((b, st) => Math.max(b, DOMAIN.best1RM(st.weight, st.reps)), 0);
        points.push({ date: s.key, weight: maxW, volume: vol, oneRM: best1 });
      }
    });

    const exDef = DOMAIN.exDefById(exId);
    const exName = (exDef && exDef.name) || (points[0] && sessions.find(s => (s.data.entries || []).some(e => e.exId === exId) && s.data.entries.find(e => e.exId === exId).exName) || exId);
    const prs = DOMAIN.prByExId(sessions);

    const suggestion = DOMAIN.nextSessionSuggestion(exId, sessions);

    const metric = document.getElementById('progMetric') ? document.getElementById('progMetric').value : 'weight';
    const range = document.getElementById('progRange') ? document.getElementById('progRange').value : 'all';

    let chartHTML = '';

    let prHistory = '';

    appearances.sort((a, b) => a.date < b.date ? 1 : -1);

            </div>
          `).join('')}
        </div>
      ` : '';
    }

    el.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;">
        <div style="font-size:16px;font-weight:600;">${escapeHtml(exName)}</div>

  function renderHeatmapSVG(sessions, year){
    const days = DOMAIN.heatmapData(sessions, year);
    // Grid estilo GitHub: columnas = semanas (lun→dom), filas = días de la semana.
    // Semana empieza en lunes (r=0) y termina en domingo (r=6).
    const firstOfYear = new Date(year, 0, 1);
    const jsDow = firstOfYear.getDay();
    const startOffset = (jsDow + 6) % 7;
    const totalDays = days.length;
    const cols = Math.ceil((totalDays + startOffset) / 7);
    const dowLabels = ['L','M','X','J','V','S','D'];

    // Construir grid de 2D para mapear correctamente día → fila de la semana
    // (necesario porque los días vacíos iniciales hacen que el bucle lineal confunda filas)
    const grid = [];
    let dayIdx = 0;
    for (let c = 0; c < cols; c++){
      grid[c] = new Array(7).fill(null);
      for (let r = 0; r < 7; r++){
        const cellPos = c * 7 + r;
        if (cellPos >= startOffset && dayIdx < totalDays){
          grid[c][r] = days[dayIdx];
          dayIdx++;
        }
      }
    }

    // Etiquetas de meses: posicionadas en la columna real donde empieza cada mes
    const monthLabels = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    const monthSpans = [];
    for (let m = 0; m < 12; m++){
      const fm = new Date(year, m, 1);
      const daysBeforeMonth = Math.round((fm - firstOfYear) / (1000 * 60 * 60 * 24));
      // Columna donde está el día 1 del mes m
      const col = Math.floor((daysBeforeMonth + startOffset) / 7);
      monthSpans.push({ name: monthLabels[m], col });
    }
    const monthsHtml = monthSpans.map(ms =>
      `<span style="grid-column:${ms.col + 1};">${ms.name}</span>`
    ).join('');

    // Render: 7 filas, cada fila con su etiqueta de día a la izquierda + celdas de esa fila
    let rowsHtml = '';
    for (let r = 0; r < 7; r++){
      let cellsInRow = '';
      for (let c = 0; c < cols; c++){
        const d = grid[c][r];
        if (d){
          cellsInRow += `<div class="heatmap-cell heat-${d.level}" title="${d.date}: ${d.count} sesión${d.count !== 1 ? 'es' : ''}"></div>`;
        } else {
          cellsInRow += `<div class="heatmap-cell heat-empty"></div>`;
        }
      }
      // Solo mostrar etiqueta si la fila tiene contenido visible (evitar líneas vacías)
      const showLabel = true;
      rowsHtml += `<div class="heatmap-row"><span class="dow-label">${showLabel ? dowLabels[r] : ''}</span><div class="heatmap-row-cells">${cellsInRow}</div></div>`;
    }

    return `<div class="heatmap-wrap">
      <div class="heatmap-nav">
        <button class="hm-nav-btn" onclick="ACTIONS.changeHeatmapYear(-1)" aria-label="Año anterior">◀</button>
        <span class="hm-year">${year}</span>
        <button class="hm-nav-btn" onclick="ACTIONS.changeHeatmapYear(1)" aria-label="Año siguiente" ${year >= new Date().getFullYear() ? 'disabled style="opacity:.3;pointer-events:none;"' : ''}>▶</button>
      </div>
      <div class="heatmap-months" style="display:grid;grid-template-columns:repeat(${cols},11px);">${monthsHtml}</div>
      <div class="heatmap-grid">${rowsHtml}</div>
      <div class="heat-legend">
        <span>Menos</span>
        <span class="heat-0"></span>
        <span class="heat-1"></span>
        <span class="heat-2"></span>
        <span class="heat-3"></span>
        <span class="heat-4"></span>
        <span>Más</span>
      </div>
    </div>`;
  }

  // ── Avance de gráfico (selector de métrica) ──
  async function drawAdvancedChart(exId, sessions, metric, rangeKey){
    metric = metric || 'weight';
    rangeKey = rangeKey || 'all';
    let cutoff = null;
    if (rangeKey === 'month'){
      cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 30);
    } else if (rangeKey === 'quarter'){
      cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
    }
    const cutoffKey = cutoff ? DOMAIN.dateKey(cutoff) : '0000-00-00';
    const points = [];
    sessions.slice().reverse().forEach(s => {
      if (s.key < cutoffKey) return;
      const e = (s.data.entries || []).find(x => x.exId === exId);
      if (!e || !e.sets || !e.sets.length) return;
      let val = 0;
      if (metric === 'weight'){
        val = Math.max(...e.sets.map(x => x.weight));
      } else if (metric === 'volume'){
        val = DOMAIN.volumeOfEntry(e);
      } else if (metric === '1rm'){
        const best = e.sets.reduce((b, st) => Math.max(b, DOMAIN.best1RM(st.weight, st.reps)), 0);
        val = best;
      }
      if (val > 0) points.push({ date: s.key, value: val });
    });
    if (points.length === 0) return '<div class="empty-note">Sin datos en este rango.</div>';
    const values = points.map(p => p.value);
    const maxV = Math.max(...values);
    const minV = Math.min(...values);
    const range = Math.max(1, maxV - minV);
    const w = 460, h = 200, pad = 32;
    const step = points.length > 1 ? (w - 2 * pad) / (points.length - 1) : 0;
    const coords = points.map((p, i) => ({
      x: pad + i * step,
      y: h - pad - ((p.value - minV) / range) * (h - 2 * pad),
      p
    }));
    const poly = coords.map(c => `${c.x},${c.y}`).join(' ');
    const dots = coords.map(c => {
      const isPR = i => c.p.value === maxV;
      return `<circle cx="${c.x}" cy="${c.y}" r="${c.p.value === maxV ? 5 : 3.5}" fill="${c.p.value === maxV ? 'var(--green)' : '#7c9bc4'}"><title>${c.p.date}: ${c.p.value}</title></circle>`;
    }).join('');
    const unit = metric === 'volume' ? 'kg·reps' : 'kg';
    const first = points[0].value, latest = points[points.length - 1].value;
    const delta = Math.round((latest - first) * 10) / 10;
    // Y-axis labels (4 valores)
    const yLabels = [0, 1, 2, 3].map(i => {
      const v = minV + (range * i) / 3;
      const y = h - pad - (i / 3) * (h - 2 * pad);
      return { v, y };
    });
    return `<div class="chart-wrap">
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;">
        <defs><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7c9bc4" stop-opacity="0.3"/><stop offset="100%" stop-color="#7c9bc4" stop-opacity="0"/></linearGradient></defs>
        ${yLabels.map(l => `<line x1="${pad}" y1="${l.y}" x2="${w - pad}" y2="${l.y}" class="chart-grid-line"/><text x="${pad - 5}" y="${l.y + 3}" text-anchor="end" class="chart-axis">${Math.round(l.v * 10) / 10}</text>`).join('')}
        <polyline points="${pad},${h - pad} ${poly} ${pad + (points.length - 1) * step},${h - pad}" fill="url(#lg2)" stroke="none"></polyline>
        <polyline points="${poly}" fill="none" stroke="#7c9bc4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
        ${dots}
      </svg>
      <div class="stat-grid" style="margin-top:10px;">
        <div class="stat-card"><div class="big">${latest}<span style="font-size:13px;color:var(--dim);"> ${unit}</span></div><div class="lbl">Actual</div></div>
        <div class="stat-card ${delta >= 0 ? 'positive' : ''}"><div class="big">${delta >= 0 ? '+' : ''}${delta}<span style="font-size:13px;color:var(--dim);"> ${unit}</span></div><div class="lbl">Cambio</div></div>
        <div class="stat-card"><div class="big">${maxV}<span style="font-size:13px;color:var(--dim);"> ${unit}</span></div><div class="lbl">Mejor</div></div>
      </div>
    </div>`;
  }

// ── Acciones (orquestan: leen STATE → llaman domain/UI → guardan) ─
const ACTIONS = (() => {
  let restInterval = null;
  let restRemaining = 0;
  let restTarget = 0;
  let restPaused = false;

  function formatRest(sec){
    const m = Math.floor(Math.max(0, sec) / 60), s = Math.max(0, sec) % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }
  function updateRestBarText(){
    const target = restTarget > 0 ? ` / ${formatRest(restTarget)}` : '';
    document.getElementById('restText').textContent = `${formatRest(restRemaining)}${target}`;
  }
  function startRestTimer(seconds){
    if (restInterval) clearInterval(restInterval);
    restRemaining = seconds;
    restTarget = seconds;
    restPaused = false;
    document.getElementById('restBar').style.display = 'flex';
    updateRestBarText();
    const pauseBtn = document.getElementById('restPauseBtn');
    if (pauseBtn) pauseBtn.textContent = '⏸';
    restInterval = setInterval(() => {
      if (restPaused) return;
      restRemaining--;
      if (restRemaining <= 0){ clearInterval(restInterval); onRestFinished(); return; }
      updateRestBarText();
    }, 1000);
  }
  function onRestFinished(){
    updateRestBarText();
    try { if (navigator.vibrate) navigator.vibrate([250, 100, 250]); } catch (e){}
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.value = 0.15;
      o.start(); setTimeout(() => { o.stop(); ctx.close(); }, 350);
    } catch (e){}
    document.getElementById('restText').textContent = '¡Listo!';
    setTimeout(() => { document.getElementById('restBar').style.display = 'none'; }, 2500);
  }
  function addRestSeconds(n){ restRemaining = Math.max(0, restRemaining + n); restTarget = Math.max(restTarget, restRemaining); updateRestBarText(); }
  function cancelRestTimer(){
    if (restInterval) clearInterval(restInterval);
    restInterval = null;
    restRemaining = 0;
    restTarget = 0;
    restPaused = false;
    document.getElementById('restBar').style.display = 'none';
  }
  function toggleRestPause(){
    restPaused = !restPaused;
    const btn = document.getElementById('restPauseBtn');
    if (btn) btn.textContent = restPaused ? '▶' : '⏸';
  }
  function startRestFromFocus(exId){
    const ex = DOMAIN.exDefById(exId);
    if (ex) startRestTimer(DOMAIN.parseRestSeconds(ex.rest));
  }

  // ── Tabs ──
  function activateTab(name){
    document.querySelectorAll('.tab, .bn-item').forEach(x => x.classList.toggle('active', x.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + name).classList.add('active');
    const finishBar = document.getElementById('finishBar');
    finishBar.style.display = name === 'hoy' && STATE.form.day ? 'block' : 'none';
    const sessionProg = document.getElementById('sessionProgress');
    if (sessionProg) sessionProg.style.display = name === 'hoy' && STATE.form.day ? 'block' : 'none';
    // Feedback háptico sutil al cambiar pestaña
    try { if (navigator.vibrate) navigator.vibrate(8); } catch (e){}
    // Scroll al top del panel (al cambiar de tab a veces te deja a media pantalla)
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── Form: edición de celdas ──
  function updateCell(exId, i, field, val){
    if (!STATE.form.data[exId]) return;
    STATE.form.data[exId][i][field] = field === 'weight' ? (parseFloat(val) || 0) : (parseInt(val) || '');
    STORAGE.saveDraft(STATE.form.dateKey);
    UI.renderFormSummary(STATE.form.day);
    UI.renderSessionProgress();
  }
  function commitSet(exId, i){
    // Se ejecuta al salir del campo (blur). Si la serie está completa (peso + reps)
    // y NO es la última serie del ejercicio, auto-arranca el timer.
    if (!STATE.form.data[exId] || !STATE.form.data[exId][i]) return;
    const st = STATE.form.data[exId][i];
    if (!st.weight || !st.reps) return;
    const ex = DOMAIN.exDefById(exId);
    if (!ex) return;
    const totalSets = STATE.form.data[exId].length;
    if (i < totalSets - 1){
      // No es la última serie del ejercicio → arrancar descanso
      const restSec = DOMAIN.parseRestSeconds(ex.rest);
      if (restSec > 0){
        ACTIONS.startRestTimer(restSec, exId);
        UI.showToast(`Descanso ${Math.floor(restSec / 60)}:${String(restSec % 60).padStart(2, '0')}`, 'info');
      }
    }
  }
  // Botón explícito "✓/⏱" — más fiable que onblur en móvil.
  // Marca la serie como hecha y dispara el timer si no es la última.
  function okSet(exId, i, isLast){
    if (!STATE.form.data[exId] || !STATE.form.data[exId][i]) return;
    const st = STATE.form.data[exId][i];
    // Si reps/peso están vacíos, solo marca visualmente y re-renderiza para que se vean los inputs
    if (st.reps === '' || !st.weight){
      UI.renderSetRows(exId, DOMAIN.exDefById(exId).failRule);
      return;
    }
    if (isLast){
      // Última serie → no hay descanso, solo feedback visual
      try { if (navigator.vibrate) navigator.vibrate(80); } catch(e){}
      UI.renderSetRows(exId, DOMAIN.exDefById(exId).failRule);
      UI.renderFormSummary(STATE.form.day);
      UI.renderSessionProgress();
      return;
    }
    const ex = DOMAIN.exDefById(exId);
    const restSec = DOMAIN.parseRestSeconds(ex.rest);
    if (restSec > 0){
      ACTIONS.startRestTimer(restSec, exId);
      UI.showToast(`Descanso ${Math.floor(restSec / 60)}:${String(restSec % 60).padStart(2, '0')}`, 'info');
    } else {
      try { if (navigator.vibrate) navigator.vibrate(80); } catch(e){}
    }
    UI.renderSetRows(exId, ex.failRule);
    UI.renderFormSummary(STATE.form.day);
    UI.renderSessionProgress();
  }
  function toggleFailCell(exId, i){
    if (!STATE.form.data[exId]) return;
    STATE.form.data[exId][i].fallo = !STATE.form.data[exId][i].fallo;
    const ex = DOMAIN.exDefById(exId);
    UI.renderSetRows(exId, ex.failRule);
    STORAGE.saveDraft(STATE.form.dateKey);
  }
  function addSet(exId){
    if (!STATE.form.data[exId]) return;
    STATE.form.data[exId].push({ reps: '', weight: '', fallo: false });
    const ex = DOMAIN.exDefById(exId);
    UI.renderSetRows(exId, ex.failRule);
    UI.renderExerciseBlockRefresh(exId);
    STORAGE.saveDraft(STATE.form.dateKey);
    UI.renderFormSummary(STATE.form.day);
    UI.renderSessionProgress();
  }
  function removeSet(exId){
    if (!STATE.form.data[exId] || STATE.form.data[exId].length <= 1) return;
    STATE.form.data[exId].pop();
    const ex = DOMAIN.exDefById(exId);
    UI.renderSetRows(exId, ex.failRule);
    UI.renderExerciseBlockRefresh(exId);
    STORAGE.saveDraft(STATE.form.dateKey);
    UI.renderFormSummary(STATE.form.day);
    UI.renderSessionProgress();
  }
  function applySuggested(exId, weight){
    if (!STATE.form.data[exId]) return;
    STATE.form.data[exId][STATE.form.data[exId].length - 1].weight = weight;
    const ex = DOMAIN.exDefById(exId);
    UI.renderSetRows(exId, ex.failRule);
    STORAGE.saveDraft(STATE.form.dateKey);
  }

  // ── Series agrupadas ──
  function updateGroupedWeight(exId, field, value){
    if (!STATE.form.groupedWeight[exId]) STATE.form.groupedWeight[exId] = { weight: '', count: 4, active: false };
    STATE.form.groupedWeight[exId][field] = field === 'weight' ? (parseFloat(value) || 0) : parseInt(value);
    STORAGE.saveDraft(STATE.form.dateKey);
  }
  function toggleGroupedWeight(exId){
    const gw = STATE.form.groupedWeight[exId] || { weight: '', count: 4, active: false };
    if (!gw.active && (!gw.weight || gw.weight <= 0)){ alert('Introduce un peso antes de aplicar.'); return; }
    gw.active = !gw.active;
    STATE.form.groupedWeight[exId] = gw;
    if (gw.active){
      // Sobrescribe todas las series con el peso común
      const rows = STATE.form.data[exId];
      if (!rows) return;
      for (let i = 0; i < Math.min(gw.count, rows.length); i++){
        rows[i].weight = gw.weight;
      }
    }
    const ex = DOMAIN.exDefById(exId);
    UI.renderSetRows(exId, ex.failRule);
    UI.renderExerciseBlockRefresh(exId);
    STORAGE.saveDraft(STATE.form.dateKey);

  // ── Drop sets ──
  function addDropSetRound(exId){
    if (!STATE.form.data[exId] || STATE.form.data[exId].length < 2) return;
    const rounds = STATE.form.dropSetRounds[exId] || [];
    const lastEnd = rounds.length ? rounds[rounds.length - 1].endIdx : -1;
    const start = lastEnd + 1;
    const end = Math.min(start + 1, STATE.form.data[exId].length - 1);
    rounds.push({ startIdx: start, endIdx: end });
    STATE.form.dropSetRounds[exId] = rounds;
    UI.renderExerciseBlockRefresh(exId);
    STORAGE.saveDraft(STATE.form.dateKey);
  }

  // ── Finalizar sesión ──
  async function finalizeSession(){
    const dayType = STATE.form.day;
    const dk = STATE.form.dateKey || DOMAIN.dateKey(new Date());
    const entries = [];
    ROUTINES[dayType].forEach(ex => {
      const sets = (STATE.form.data[ex.id] || []).filter(s => s.reps !== '' && s.weight > 0);
      if (sets.length > 0){
        const isDropSet = (STATE.form.dropSetRounds[ex.id] || []).length > 0;
        entries.push({ exId: ex.id, exName: ex.name, sets, dropSet: isDropSet });
      }
    });
    if (entries.length === 0){ alert('Registra al menos un ejercicio antes de finalizar.'); return; }
    const emptyCount = ROUTINES[dayType].reduce((a, ex) => {
      const total = (STATE.form.data[ex.id] || []).filter(s => s.reps !== '' && s.weight > 0).length;
      const planned = ex.sets;
      return a + Math.max(0, planned - total);
    }, 0);
    if (emptyCount > 0){
      if (!confirm(`Tienes ${emptyCount} series vacías que no se guardarán. ¿Finalizar de todas formas?`)) return;
    }
    const sessions = await STORAGE.getAllSessions();
    const sessionsExcl = sessions.filter(s => s.key !== dk);
    const prevByExId = {};
    entries.forEach(e => {
      const f = sessionsExcl.find(s => s.key < dk && (s.data.entries || []).some(x => x.exId === e.exId));
      if (f){ const entry = f.data.entries.find(x => x.exId === e.exId); prevByExId[e.exId] = entry; }
    });
    const atm = DOMAIN.allTimeMaxByExId(sessionsExcl, null);
    const feedback = DOMAIN.generateFeedback(entries, prevByExId, atm);
    const session = {
      v: SCHEMA_VERSION,
      dayType, entries,
      notes: STATE.form.notes,
      rating: feedback.stars,
      tips: feedback.tips,
      positives: feedback.positives,
      loggedAt: new Date().toISOString(),
      rpe: { ...STATE.form.rpe },
      key: dk
    };
    await STORAGE.saveSession(dk, session);
    await STORAGE.clearDraft(dk);
    STATE.form.dateKey = null;
    // Detectar nuevos PRs y mostrar toasts
    try {
      const newPRs = DOMAIN.detectPRs(session, await STORAGE.getAllSessions(true));
      newPRs.forEach(pr => {
        if (pr.weight > 0){
          const prevTxt = pr.previous > 0 ? ` (antes ${pr.previous}kg)` : ' (primer registro)';
          UI.showToast(`🏆 PR en ${pr.exName}: ${pr.weight}kg${prevTxt}`, 'info');
        }
      });
      if (newPRs.length > 0) UI.renderStats();
    } catch(e){ console.error('PR detection:', e); }
    // Mostrar resumen
    UI.renderSessionSummary(session);
    UI.renderWeeklyVolume();
    UI.renderHistorial();
    UI.renderCalendar();
  }

  // ── Backup / Import ──
  async function exportBackup(){
    try {
      const sessions = await STORAGE.getAllSessions(true);
      const allKeys = await STORAGE.list('', false);
      const drafts = [];
      const meta = {};
      for (const k of (allKeys.keys || [])){
        const short = k.startsWith('draft:') || k.startsWith('meta:') || k.startsWith('session:') ? k : k;
        try {
          const r = await STORAGE.get(short, false);
          if (!r) continue;
          if (short.startsWith('draft:')) drafts.push({ key: short.slice('draft:'.length), value: JSON.parse(r.value) });
          else if (short.startsWith('meta:')) meta[short.slice('meta:'.length)] = r.value;
        } catch(e){}
      }
      const profile = {
        exportDate: new Date().toISOString(),
        appVersion: 'v5',
        schemaVersion: SCHEMA_VERSION,
        sessionCount: sessions.length,
        totalVolume: sessions.reduce((acc, s) => acc + DOMAIN.volumeOfSession(s.data), 0)
      };
      const backup = {
        profile,
        meta,
        sessions: sessions.map(s => ({ key: s.key, data: s.data })),
        drafts
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const today = DOMAIN.dateKey(new Date());
      a.href = url;
      a.download = `torsoPierna-backup-${today}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      UI.showToast(`💾 Backup descargado (${sessions.length} sesiones)`, 'info');
    } catch(e){
      console.error('exportBackup:', e);
      UI.showToast('Error al exportar backup', 'error');
    }
  }

  async function importBackup(event){
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (!confirm(`Importar "${file.name}" reemplazará las sesiones con el mismo identificador. ¿Continuar?`)){
      event.target.value = '';
      return;
    }
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      if (!backup.sessions || !Array.isArray(backup.sessions)){
        UI.showToast('Archivo no válido (falta sessions)', 'error');
        return;
      }
      let imported = 0, merged = 0;
      for (const s of backup.sessions){
        if (!s.key || !s.data) continue;
        const existing = await STORAGE.getSession(s.key).catch(() => null);
        if (!existing){
          imported++;
        } else {
          merged++;
        }
        await STORAGE.saveSession(s.key, s.data);
      }
      if (backup.drafts && Array.isArray(backup.drafts)){
        for (const d of backup.drafts){
          await STORAGE.saveDraft(d.key).catch(() => {});
          try {
            await STORAGE.set('draft:' + d.key, JSON.stringify(d.value), false);
          } catch(e){}
        }
      }
      if (backup.meta && typeof backup.meta === 'object'){
        for (const [k, v] of Object.entries(backup.meta)){
          if (k.startsWith('seed_')) continue; // no importar flags de seed
          await STORAGE.set('meta:' + k, v, false).catch(() => {});
        }
      }
      STATE.sessionsCache = null;
      await UI.renderHoy();
      await UI.renderCalendar();
      await UI.renderHistorial();
      if (typeof UI.renderStats === 'function') await UI.renderStats();
      UI.closeModal();
      UI.showToast(`📥 Importado: ${imported} nuevas, ${merged} actualizadas`, 'info');
    } catch(e){
      console.error('importBackup:', e);
      UI.showToast('Error al importar: ' + e.message, 'error');
    }
    event.target.value = '';
  }

// ── Seed inicial: cargar las 10 sesiones históricas (IDEMPOTENTE) ──
// Cada llamada borra TODAS las sesiones que coincidan con fechas del array y
// las reescribe desde cero. Garantiza que los datos siempre coincidan con el código.
async function seedHistory(){
  console.log('[seed] Iniciando seedHistory (idempotente)…');
  const processed = [];
  let savedCount = 0;

  // Paso 1: borrar TODAS las sesiones históricas previas (independiente de flags)
  try {
    const dates = HISTORICAL_SESSIONS.map(h => h.date);
    const allSessions = (await STORAGE.getAllSessions().catch(() => [])) || [];
    for (const s of allSessions){
      if (s && s.key && dates.includes(s.key)){
        try {
          await STORAGE.del('session:' + s.key, false);
        } catch(e){ console.error('[seed] Error borrando', s.key, e); }
      }
    }
    await STORAGE.del('meta:seed_v7', false).catch(() => {});
    await STORAGE.del('meta:seed_v6', false).catch(() => {});
    STATE.sessionsCache = null;
    console.log('[seed] Sesiones históricas previas borradas.');
  } catch (e){
    console.error('[seed] Error en limpieza inicial:', e);
  }

  // Paso 2: sembrar desde cero (incluso si ya existían)
  for (const hs of HISTORICAL_SESSIONS){
    try {
      const prevByExId = {};
      hs.entries.forEach(e => { const f = DOMAIN.lastEntryFor(processed, e.exId); if (f) prevByExId[e.exId] = f.entry; });
      const atm = DOMAIN.allTimeMaxByExId(processed);
      const feedback = DOMAIN.generateFeedback(hs.entries, prevByExId, atm);
      const session = {
        v: SCHEMA_VERSION,
        dayType: hs.dayType,
        entries: hs.entries,
        notes: hs.notes,
        rating: feedback.stars,
        tips: feedback.tips,
        positives: feedback.positives,
        loggedAt: hs.date + 'T00:00:00.000Z',
        rpe: {},
        key: hs.date
      };
      await STORAGE.saveSession(hs.date, session);
      processed.unshift({ key: hs.date, data: session });
      savedCount++;
      console.log('[seed] Guardada:', hs.date, hs.dayType, '—', hs.entries.length, 'ejercicios');
    } catch(e){
      console.error('[seed] Error guardando', hs.date, e);
    }
  }
  console.log('[seed] Resultado: ', savedCount, ' guardadas de ', HISTORICAL_SESSIONS.length);
  if (savedCount > 0){
    await STORAGE.set('meta:seed_v7', '1', false).catch(() => {});
  }
  STATE.sessionsCache = null;
}
