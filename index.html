// ── Auto-finalizar borradores antiguos ──
async function autoFinalizeStaleDrafts(){
  try {
    const list = await STORAGE.list('draft:', false);
    if (!list || !list.keys || list.keys.length === 0) return;
    const today = DOMAIN.dateKey(new Date());
    for (const rawKey of list.keys){
      const fullKey = rawKey.startsWith('draft:') ? rawKey : 'draft:' + rawKey;
      const shortKey = rawKey.startsWith('draft:') ? rawKey.slice('draft:'.length) : rawKey;
      if (shortKey === today) continue;
      try {
        const r = await STORAGE.get(fullKey, false);
        if (!r) continue;
        const draft = JSON.parse(r.value);
        const dayType = draft.dayType;
        if (!ROUTINES[dayType]){ await STORAGE.del(fullKey, false); continue; }
        const alreadyFinalized = await STORAGE.getSession(shortKey);
        if (alreadyFinalized){ await STORAGE.del(fullKey, false); continue; }
        const entries = [];
        ROUTINES[dayType].forEach(ex => {
          const sets = (draft.data[ex.id] || []).filter(s => s.reps !== '' && s.weight > 0);
          if (sets.length > 0){
            const isDropSet = (draft.dropSetRounds && draft.dropSetRounds[ex.id] || []).length > 0;
            entries.push({ exId: ex.id, exName: ex.name, sets, dropSet: isDropSet });
          }
        });
        if (entries.length === 0){ await STORAGE.del(fullKey, false); continue; }
        const sessions = await STORAGE.getAllSessions(true);
        const sessionsExcl = sessions.filter(s => s.key !== shortKey);
        const prevByExId = {};
        entries.forEach(e => {
          const f = sessionsExcl.find(s => s.key < shortKey && (s.data && s.data.entries || []).some(x => x.exId === e.exId));
          if (f){ prevByExId[e.exId] = f.data.entries.find(x => x.exId === e.exId); }
        });
        const atm = DOMAIN.allTimeMaxByExId(sessionsExcl, null);
        const feedback = DOMAIN.generateFeedback(entries, prevByExId, atm);
        const noteSuffix = 'Registrada automáticamente al no pulsar "Finalizar sesión" a tiempo.';
        const session = {
          v: SCHEMA_VERSION,
          dayType, entries,
          notes: draft.notes ? draft.notes + ' · ' + noteSuffix : noteSuffix,
          rating: feedback.stars, tips: feedback.tips, positives: feedback.positives,
          loggedAt: new Date().toISOString(),
          rpe: draft.rpe || {},
          key: shortKey
        };
        await STORAGE.saveSession(shortKey, session);
        await STORAGE.del(fullKey, false);
        STATE.sessionsCache = null;
      } catch (e){ console.error('No se pudo recuperar el borrador', fullKey, e); }
    }
  } catch (e){ console.error('autoFinalizeStaleDrafts falló', e); }
}

// ── Populate del picker de Progreso ──
async function populateProgPicker(){
  const picker = document.getElementById('progPicker');
  const m = new Map();
  Object.values(ROUTINES).flat().forEach(ex => m.set(ex.id, ex.name));
  const sessions = await STORAGE.getAllSessions();
  sessions.forEach(s => (s.data && s.data.entries || []).forEach(e => {
    if (!m.has(e.exId)) m.set(e.exId, e.exName);
  }));
  const prev = picker.value;
  picker.innerHTML = Array.from(m.entries()).map(([id, name]) => `<option value="${id}">${UI.escapeHtml(name)}</option>`).join('');
  if (prev && m.has(prev)) picker.value = prev;
  UI.renderProgress();
  UI.renderWeeklyVolume();
}

// ── 1. Registrar service worker (sólo en HTTPS / localhost) ──
if ('serviceWorker' in navigator){
  // Esperar a que cargue la página para no bloquear render
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('[PWA] SW registrado en:', reg.scope))
      .catch(err => console.warn('[PWA] SW no registrado:', err.message));
  });
}

// ── 2. Capturar el prompt de instalación (Chrome Android) ──
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Mostrar banner tras 2s (no agresivo)
  setTimeout(() => {
    if (typeof UI !== 'undefined' && typeof UI.showInstallBanner === 'function'){
      UI.showInstallBanner();
    }
  }, 2000);
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  if (typeof UI !== 'undefined' && typeof UI.showToast === 'function'){
    UI.showToast('✓ App instalada. Ábrela desde tu pantalla de inicio.', 'success');
  }
});

// ── 3. UI.showInstallBanner() — banner no intrusivo ──
UI.showInstallBanner = function(){
  if (sessionStorage.getItem('installDismissed')) return;
  if (document.getElementById('installBanner')) return;

  const banner = document.createElement('div');
  banner.id = 'installBanner';
  banner.className = 'install-banner';
  banner.setAttribute('role', 'dialog');
  banner.setAttribute('aria-label', 'Instalar aplicación');
  banner.innerHTML = `
    <div class="install-text">
      <strong>📲 Instalar app</strong>
      <small>Acceso directo desde tu pantalla</small>
    </div>
    <div class="install-actions">
      <button class="ib-dismiss" type="button">No</button>
      <button class="ib-install" type="button">Instalar</button>
    </div>
  `;

  const cleanUp = () => banner.remove();

  banner.querySelector('.ib-install').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    cleanUp();
    deferredPrompt.prompt();
    try {
      const {outcome} = await deferredPrompt.userChoice;
      if (outcome === 'accepted'){
        UI.showToast('Instalando...', 'info');
      }
    } catch (err) {
      console.warn('[PWA] install prompt falló:', err);
    }
    deferredPrompt = null;
  });

  banner.querySelector('.ib-dismiss').addEventListener('click', () => {
    sessionStorage.setItem('installDismissed', '1');
    cleanUp();
  });

  document.body.appendChild(banner);
  // Forzar reflow antes de añadir la clase (para que la transición funcione)
  void banner.offsetHeight;
  setTimeout(() => banner.classList.add('visible'), 50);
};

// ── 4. Sincronizar bottom nav con tabs existentes ──
// activateTab() vive en ACTIONS, no en UI. Hay que llamarlo correctamente.
document.querySelectorAll('.bn-item').forEach(b => {
  b.addEventListener('click', () => {
    ACTIONS.activateTab(b.dataset.tab);
  });
});
